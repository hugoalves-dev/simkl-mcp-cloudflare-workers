name = "simkl-mcp"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
# Preserve existing workers.dev MCP clients and PR preview URLs.
workers_dev = true
preview_urls = true

# Canonical public endpoint for the independent Simkl MCP deployment.
[[routes]]
pattern = "mcp-simkl.hugojava.dev"
custom_domain = true

# kv namespace for oauth provider storage
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "dd708cbd426048878d4032bb1b752e44"
preview_id = "SIMKL_MCP"

# durable objects configuration for mcp agent
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SimklMCP"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SimklLibraryCache"]

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "SimklMCP"

[[durable_objects.bindings]]
name = "SIMKL_LIBRARY_CACHE"
class_name = "SimklLibraryCache"

# Generate metadata before local development, dry runs and all deployments.
[build]
command = "bun run capabilities"

# static assets configuration
[assets]
directory = "./static/"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = true

[vars]
SIMKL_API_BASE_URL = "https://api.simkl.com"
# Minimum lazy activity-check interval; invalid values fall back to 300 seconds.
SIMKL_LIBRARY_CACHE_TTL_SECONDS = "300"

# OAuth callback URLs contain one-time credentials. Always redact them.
[observability]
enabled = false
redact_query_string = true

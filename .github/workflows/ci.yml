name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

  codegen:
    name: Codegen
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      # generated/tools.ts is gitignored but required by the typecheck
      - run: bun run codegen

      - name: Upload generated bindings
        uses: actions/upload-artifact@v4
        with:
          name: generated-bindings
          path: generated/
          if-no-files-found: error
          retention-days: 1

  typecheck:
    name: Typecheck
    needs: codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: generated-bindings
          path: generated/

      - run: bun run typecheck

  test:
    name: Test
    needs: [codegen, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: generated-bindings
          path: generated/

      - run: bun test
      - name: Test Worker RPC and persistence
        run: node tests/library-runtime/smoke.mjs

  deploy:
    name: Deploy to Cloudflare
    needs: [codegen, typecheck, test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-deploy-main
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: generated-bindings
          path: generated/
      - name: Skip stale main revisions
        id: current
        run: |
          latest_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$GITHUB_SHA" = "$latest_sha" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment because main has a newer revision"
          fi
      - name: Verify Cloudflare credentials are configured
        if: steps.current.outputs.deploy == 'true'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set the CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Set the CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
      - name: Configure Cloudflare Observability for this deploy
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        env:
          OBSERVABILITY_ENABLED: ${{ vars.CLOUDFLARE_OBSERVABILITY_ENABLED || 'false' }}
        run: |
          # Optional GitHub Actions repository variable: CLOUDFLARE_OBSERVABILITY_ENABLED=true|false.
          # The upstream-compatible wrangler.toml remains unchanged in Git.
          case "$OBSERVABILITY_ENABLED" in
            true|false) ;;
            *) echo "::error::CLOUDFLARE_OBSERVABILITY_ENABLED must be 'true' or 'false'"; exit 1 ;;
          esac

          if grep -Eq '^\[observability(\.issues)?\]' wrangler.toml; then
            echo "::error::Observability is already declared in wrangler.toml; avoid duplicate sections"
            exit 1
          fi

          {
            printf '\n[observability]\n'
            printf 'enabled = %s\n' "$OBSERVABILITY_ENABLED"
            printf 'head_sampling_rate = 1\n'
            printf '\n[observability.issues]\n'
            printf 'enabled = %s\n' "$OBSERVABILITY_ENABLED"
          } >> wrangler.toml
      - name: Deploy Worker
        if: steps.current.outputs.deploy == 'true'
        run: bun run deploy

name: Watch Simkl API Docs

on:
  schedule:
    - cron: "17 */6 * * *"
      timezone: "America/Sao_Paulo"

  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: simkl-api-doc-watch
  cancel-in-progress: false

jobs:
  check-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download current Simkl docs
        run: |
          mkdir -p .simkl-doc-watch

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            https://api.simkl.org/llms-full.txt \
            -o .simkl-doc-watch/docs.txt

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            https://api.simkl.org/openapi.json \
            -o /tmp/openapi.json

          # Normalize JSON so property ordering does not create false positives.
          jq --sort-keys . /tmp/openapi.json > .simkl-doc-watch/openapi.json

      - name: Detect changes
        id: diff
        shell: bash
        run: |
          # First run: there is no baseline committed yet.
          if ! git ls-files --error-unmatch \
            .simkl-doc-watch/docs.txt \
            .simkl-doc-watch/openapi.json \
            >/dev/null 2>&1; then

            echo "initialized=true" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo "No previous snapshot found. Initial baseline will be created."
            exit 0
          fi

          echo "initialized=false" >> "$GITHUB_OUTPUT"

          if git diff --quiet -- .simkl-doc-watch; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Simkl API documentation changes detected."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Simkl API documentation changes detected."

          git diff \
            --no-ext-diff \
            --unified=3 \
            -- .simkl-doc-watch \
            > /tmp/simkl-docs.diff

          {
            echo "## Simkl API documentation changed"
            echo
            echo 'Changes were detected in `llms-full.txt` and/or `openapi.json`.'
            echo
            echo "### Diff"
            echo
            echo '```diff'
            head -c 45000 /tmp/simkl-docs.diff
            echo
            echo '```'
            echo
            echo "_The diff may be truncated if the documentation change is very large._"
          } > /tmp/issue.md

      - name: Create GitHub issue
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create simkl-docs \
            --description "Changes detected in Simkl API documentation" \
            --color "0E8A16" \
            --force

          gh issue create \
            --title "Simkl API documentation changed" \
            --body-file /tmp/issue.md \
            --label "simkl-docs" \
            --assignee "$GITHUB_REPOSITORY_OWNER"

      - name: Save new snapshot
        if: |
          steps.diff.outputs.initialized == 'true' ||
          steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .simkl-doc-watch

          if [ "${{ steps.diff.outputs.initialized }}" = "true" ]; then
            git commit -m "chore: initialize Simkl API docs snapshot"
          else
            git commit -m "chore: update Simkl API docs snapshot"
          fi

          git push
